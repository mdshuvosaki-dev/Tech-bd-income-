<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tech BD Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Hind+Siliguri:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
:root{
  --bg:#eef5f3;--surface:#ffffff;--surface2:#f7faf9;
  --ink:#0a2620;--ink2:#3d5a52;--mute:#8aa6a0;
  --primary:#0db981;--primary2:#0a9668;--primary-soft:#e6f9f1;
  --blue-soft:#e0ecfe;--amber-soft:#fef3d6;--purple-soft:#ece2fe;
  --pink-soft:#fce0ef;--red-soft:#fee2e2;--cyan-soft:#def6fb;--indigo-soft:#e6e8fe;
  --line:#e4eeeb;--line2:#d4e3de;
  --shadow-sm:0 1px 3px rgba(10,40,30,.06),0 2px 8px rgba(10,40,30,.04);
  --shadow:0 4px 12px rgba(10,40,30,.07),0 12px 30px rgba(10,40,30,.06);
  --ease:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.2,1.2,.3,1);
}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:500 14px/1.55 'Plus Jakarta Sans','Hind Siliguri',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(10,60,40,.16);border-radius:10px;border:2px solid transparent;background-clip:padding-box}

/* LOGIN */
.login-page{display:grid;place-items:center;min-height:100vh;padding:24px;background:radial-gradient(60% 50% at 20% 15%,rgba(13,185,129,.22),transparent 60%),radial-gradient(50% 45% at 85% 80%,rgba(59,130,246,.16),transparent 60%),linear-gradient(135deg,#f0fbf6,#e8f2fe 50%,#f0fbf6)}
.login-card{background:#fff;border-radius:32px;padding:44px 38px 36px;width:min(440px,100%);box-shadow:0 4px 24px rgba(10,60,40,.08),0 40px 80px rgba(10,60,40,.12);border:1px solid rgba(255,255,255,.7);animation:loginIn .7s cubic-bezier(.2,1.2,.3,1) both}
@keyframes loginIn{from{opacity:0;transform:translateY(28px) scale(.96)}}
.login-mark{width:76px;height:76px;margin:0 auto 20px;border-radius:22px;background:linear-gradient(135deg,#0db981,#0a9668);display:grid;place-items:center;font-size:36px;color:#fff;box-shadow:0 16px 36px rgba(13,185,129,.35),inset 0 2px 0 rgba(255,255,255,.35)}
.login-card h1{font-size:26px;font-weight:800;text-align:center;letter-spacing:-.02em;color:#0a2620;margin-bottom:6px}
.login-card .tag{text-align:center;font-size:11px;font-weight:800;color:var(--primary);letter-spacing:.18em;margin-bottom:30px}
.field{display:block;margin-bottom:16px}
.field label{display:block;font-size:11.5px;font-weight:800;color:#0a2620;letter-spacing:.04em;margin-bottom:8px}
.field input,.field select,.field textarea{width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface2);font-size:14px;font-weight:600;transition:.2s var(--ease)}
.field textarea{min-height:90px;resize:vertical;line-height:1.55;font-weight:500}
.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px rgba(13,185,129,.12)}
.field select{appearance:none;cursor:pointer;background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233d5a52' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e");background-repeat:no-repeat;background-position:right 14px center;background-size:14px;padding-right:40px}
.btn-login{width:100%;padding:16px;border-radius:14px;background:linear-gradient(135deg,#0db981,#0a9668);color:#fff;font-weight:800;font-size:15px;letter-spacing:.02em;box-shadow:0 12px 26px rgba(13,185,129,.32),inset 0 1px 0 rgba(255,255,255,.3);transition:.15s var(--ease);margin-top:8px}
.btn-login:active{transform:scale(.97)}
.err{color:#dc2626;font-size:12.5px;margin-top:14px;min-height:18px;text-align:center;font-weight:700}
.cred-box{margin-top:22px;padding:16px 18px;background:linear-gradient(135deg,#f0fbf6,#f7faf9);border:1.5px dashed rgba(13,185,129,.4);border-radius:16px;font-size:12.5px;color:#0a2620;line-height:1.9}
.cred-box b{color:var(--primary2)}
.cred-box .lbl{font-size:10px;font-weight:800;color:var(--mute);letter-spacing:.1em;display:block;margin-bottom:6px}

/* TOPBAR */
.app{max-width:1240px;margin:0 auto;padding:22px 20px 100px}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:22px;box-shadow:var(--shadow-sm);border:1px solid var(--line);margin-bottom:22px;position:sticky;top:14px;z-index:50;backdrop-filter:blur(20px);background:rgba(255,255,255,.92)}
.brand-mark{width:44px;height:44px;border-radius:14px;flex:none;background:linear-gradient(135deg,#0db981,#0a9668);display:grid;place-items:center;font-size:20px;color:#fff;box-shadow:0 8px 20px rgba(13,185,129,.3)}
.brand-text{display:flex;flex-direction:column;line-height:1.15;min-width:0;flex:1}
.brand-text b{font-size:15px;font-weight:800;letter-spacing:-.01em}
.brand-text span{font-size:11px;color:var(--mute);font-weight:700;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-user{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;background:var(--primary-soft);font-size:11.5px;font-weight:800;color:var(--primary2);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-user::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--primary);flex:none;box-shadow:0 0 0 3px rgba(13,185,129,.25)}
.btn-logout{width:44px;height:44px;border-radius:14px;background:#fef2f2;color:#dc2626;display:grid;place-items:center;font-size:18px;transition:.15s var(--ease);border:1px solid #fee2e2;flex:none}
.btn-logout:active{transform:scale(.94)}

/* WELCOME */
.welcome{padding:28px 26px;background:linear-gradient(135deg,#0db981,#0a9668);color:#fff;border-radius:26px;margin-bottom:22px;position:relative;overflow:hidden;box-shadow:0 20px 44px rgba(13,185,129,.28)}
.welcome::before{content:'';position:absolute;top:-60px;right:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%)}
.welcome h2{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px;position:relative;z-index:1}
.welcome p{font-size:13.5px;opacity:.92;font-weight:600;position:relative;z-index:1}
.welcome .badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:10px;background:rgba(255,255,255,.22);font-size:11px;font-weight:800;letter-spacing:.03em;margin-top:12px;position:relative;z-index:1}
.welcome .badge::before{content:'';width:6px;height:6px;border-radius:50%;background:#fff}

/* SECTIONS */
.section-title{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase;margin:0 4px 14px}
.section-title::before{content:'';width:4px;height:16px;border-radius:3px;background:linear-gradient(180deg,#0db981,#0a9668)}
.feature-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:28px}
.feature-btn{background:var(--surface);border-radius:20px;padding:22px 18px;text-align:left;border:1px solid var(--line);box-shadow:var(--shadow-sm);cursor:pointer;transition:.2s var(--ease);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px;animation:fadeUp .4s var(--ease) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}}
.feature-btn:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--accent)}
.feature-btn:active{transform:scale(.98)}
.feature-ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:24px;color:#fff;background:var(--accent);box-shadow:0 8px 18px var(--accent-shadow),inset 0 1px 0 rgba(255,255,255,.5);transition:.2s var(--ease)}
.feature-btn:hover .feature-ic{transform:scale(1.06) rotate(-3deg)}
.feature-btn b{display:block;font-size:14.5px;font-weight:800;color:var(--ink)}
.feature-btn small{display:block;font-size:11.5px;color:var(--mute);font-weight:600;line-height:1.4;margin-top:2px}
.feature-badge{position:absolute;top:14px;right:14px;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:#ef4444;color:#fff;font-size:11px;font-weight:800;display:none;place-items:center;box-shadow:0 4px 10px rgba(239,68,68,.35)}
.feature-badge.show{display:grid}

.f-primary{--accent:linear-gradient(135deg,#0db981,#0a9668);--accent-shadow:rgba(13,185,129,.32)}
.f-blue{--accent:linear-gradient(135deg,#3b82f6,#2563eb);--accent-shadow:rgba(59,130,246,.3)}
.f-amber{--accent:linear-gradient(135deg,#f59e0b,#d97706);--accent-shadow:rgba(245,158,11,.3)}
.f-purple{--accent:linear-gradient(135deg,#8b5cf6,#7c3aed);--accent-shadow:rgba(139,92,246,.3)}
.f-pink{--accent:linear-gradient(135deg,#ec4899,#db2777);--accent-shadow:rgba(236,72,153,.3)}
.f-red{--accent:linear-gradient(135deg,#ef4444,#dc2626);--accent-shadow:rgba(239,68,68,.3)}
.f-cyan{--accent:linear-gradient(135deg,#06b6d4,#0891b2);--accent-shadow:rgba(6,182,212,.3)}
.f-indigo{--accent:linear-gradient(135deg,#6366f1,#4f46e5);--accent-shadow:rgba(99,102,241,.3)}
.f-orange{--accent:linear-gradient(135deg,#f97316,#ea580c);--accent-shadow:rgba(249,115,22,.3)}
.f-slate{--accent:linear-gradient(135deg,#64748b,#475569);--accent-shadow:rgba(100,116,139,.3)}
.f-emerald{--accent:linear-gradient(135deg,#10b981,#059669);--accent-shadow:rgba(16,185,129,.32)}

/* MINI STATS */
.mini-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:26px}
.mini-stat{background:var(--surface);border-radius:16px;padding:16px;border:1px solid var(--line);box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:12px}
.mini-stat .ico{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:18px}
.mini-stat .info{min-width:0}
.mini-stat b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em;color:var(--ink);line-height:1.1}
.mini-stat small{display:block;font-size:10.5px;color:var(--mute);font-weight:800;letter-spacing:.06em;margin-top:3px;text-transform:uppercase}

/* VIEW */
.view{animation:viewIn .4s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}}
.view-head{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.btn-back{width:46px;height:46px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:20px;color:var(--ink2);box-shadow:var(--shadow-sm);transition:.15s var(--ease);flex:none}
.btn-back:active{transform:scale(.94)}
.view-head h2{font-size:22px;font-weight:800;letter-spacing:-.015em;color:var(--ink);display:flex;align-items:center;gap:10px}
.view-head h2 .em{font-size:24px;line-height:1}
.view-head .sub{font-size:12.5px;color:var(--mute);font-weight:600;margin-top:2px}
.view-head-info{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.pill-stat{padding:8px 14px;border-radius:12px;background:var(--primary-soft);color:var(--primary2);font-size:12px;font-weight:800;border:1px solid rgba(13,185,129,.2)}
.pill-stat.warn{background:var(--amber-soft);color:#b45309;border-color:rgba(245,158,11,.24)}
.pill-stat.info{background:var(--blue-soft);color:#1d4ed8;border-color:rgba(59,130,246,.24)}

/* CARD */
.card{background:var(--surface);border-radius:22px;padding:24px;margin-bottom:18px;border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.card h3{font-size:16px;font-weight:800;color:var(--ink);letter-spacing:-.005em;margin-bottom:18px;display:flex;align-items:center;gap:9px}
.card h3 .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:16px;background:var(--primary-soft);color:var(--primary2)}
.card h3.blue .ic{background:var(--blue-soft);color:#1d4ed8}
.card h3.amber .ic{background:var(--amber-soft);color:#b45309}
.card h3.purple .ic{background:var(--purple-soft);color:#7c3aed}
.card h3.pink .ic{background:var(--pink-soft);color:#be185d}
.card h3.red .ic{background:var(--red-soft);color:#b91c1c}
.card h3.cyan .ic{background:var(--cyan-soft);color:#0891b2}

.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.field.full{grid-column:1/-1}

/* BUTTONS */
.btn{padding:12px 22px;border-radius:12px;background:linear-gradient(135deg,#0db981,#0a9668);color:#fff;font-weight:800;font-size:13.5px;letter-spacing:.02em;box-shadow:0 8px 20px rgba(13,185,129,.28),inset 0 1px 0 rgba(255,255,255,.28);transition:.15s var(--ease);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.97)}
.btn.blue{background:linear-gradient(135deg,#3b82f6,#2563eb);box-shadow:0 8px 20px rgba(59,130,246,.28),inset 0 1px 0 rgba(255,255,255,.28)}
.btn.amber{background:linear-gradient(135deg,#f59e0b,#d97706);box-shadow:0 8px 20px rgba(245,158,11,.28),inset 0 1px 0 rgba(255,255,255,.28)}
.btn.red{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 8px 20px rgba(239,68,68,.28),inset 0 1px 0 rgba(255,255,255,.28)}
.btn.purple{background:linear-gradient(135deg,#8b5cf6,#7c3aed);box-shadow:0 8px 20px rgba(139,92,246,.28),inset 0 1px 0 rgba(255,255,255,.28)}
.btn.ghost{background:var(--surface);color:var(--ink2);border:1.5px solid var(--line);box-shadow:var(--shadow-sm)}
.btn.sm{padding:9px 16px;font-size:12.5px;border-radius:10px}

/* TABLE */
.tbl-wrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line);background:#fff}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
th{text-align:left;font-size:11px;letter-spacing:.08em;color:var(--mute);padding:13px 16px;background:var(--surface2);text-transform:uppercase;font-weight:800;border-bottom:1px solid var(--line)}
td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover td{background:rgba(13,185,129,.025)}
tbody tr:last-child td{border-bottom:0}

.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:10px;font-size:11px;font-weight:800}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.ok{background:#dcfce7;color:#15803d}
.badge.pend{background:#fef3c7;color:#b45309}
.badge.rej{background:#fee2e2;color:#b91c1c}
.badge.info{background:#dbeafe;color:#1d4ed8}

.chip{display:inline-block;font-size:11px;font-weight:800;padding:5px 11px;border-radius:9px;background:var(--primary-soft);color:var(--primary2)}
.chip.blue{background:var(--blue-soft);color:#1d4ed8}
.chip.amber{background:var(--amber-soft);color:#b45309}
.chip.purple{background:var(--purple-soft);color:#6d28d9}
.chip.pink{background:var(--pink-soft);color:#be185d}
.chip.red{background:var(--red-soft);color:#b91c1c}
.code-snip{font-family:monospace;font-size:12px;background:var(--surface2);padding:4px 10px;border-radius:8px;color:var(--primary2);border:1px solid var(--line);font-weight:700}
.row-act{display:flex;gap:6px;flex-wrap:wrap}

/* EMPTY & LOADING */
.empty{text-align:center;color:var(--mute);padding:50px 20px;font-weight:700;font-size:14px}
.empty .em{display:block;font-size:54px;margin-bottom:14px;opacity:.6}
.loading{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--mute);padding:44px;font-weight:700;font-size:14px}
.loading::before{content:'';width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOAST */
.toast{position:fixed;top:24px;right:24px;padding:16px 22px 16px 56px;border-radius:16px;background:#fff;color:var(--ink);font-weight:800;font-size:13.5px;box-shadow:0 20px 44px rgba(10,60,40,.18),0 4px 10px rgba(10,60,40,.08);border:1.5px solid var(--line);opacity:0;transform:translateX(140%);transition:.42s cubic-bezier(.2,1.2,.3,1);z-index:9999;pointer-events:none;max-width:340px;min-width:220px}
.toast::before{content:'✓';position:absolute;left:14px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:10px;background:linear-gradient(135deg,#0db981,#0a9668);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}
.toast.show{opacity:1;transform:none}
.toast.err{border-color:#fecaca;background:#fef2f2;color:#991b1b}
.toast.err::before{content:'!';background:linear-gradient(135deg,#ef4444,#dc2626)}
.toast.info{border-color:#bfdbfe;background:#eff6ff;color:#1e40af}
.toast.info::before{content:'i';background:linear-gradient(135deg,#3b82f6,#2563eb)}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(10,40,30,.5);backdrop-filter:blur(6px);display:none;place-items:center;z-index:9998;padding:20px}
.modal-bg.show{display:grid;animation:fadeIn .2s var(--ease)}
@keyframes fadeIn{from{opacity:0}}
.modal{background:#fff;border-radius:24px;padding:28px 26px;width:min(420px,100%);box-shadow:0 30px 70px rgba(10,40,30,.32);animation:modalIn .35s cubic-bezier(.2,1.2,.3,1) both}
@keyframes modalIn{from{opacity:0;transform:scale(.9) translateY(20px)}}
.modal h3{font-size:19px;font-weight:800;color:var(--ink);margin-bottom:10px}
.modal p{font-size:14px;color:var(--ink2);line-height:1.6;margin-bottom:24px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

.muted{color:var(--mute);font-size:12.5px;font-weight:600;line-height:1.65}
.divider{height:1px;background:var(--line);margin:18px 0}
.notice{padding:16px 18px;border-radius:14px;background:linear-gradient(135deg,#f0fbf6,#f7faf9);border:1.5px solid rgba(13,185,129,.22);display:flex;align-items:flex-start;gap:12px;font-size:13px;color:var(--ink2);line-height:1.6;margin-bottom:18px}
.notice .em{font-size:22px;flex:none;line-height:1}
.notice b{color:var(--primary2)}
.qitem{padding:18px;border-radius:16px;background:var(--surface2);border:1px solid var(--line);margin-bottom:10px}
.qitem b{font-size:13.5px;font-weight:800}
.qmeta{color:var(--mute);font-size:11.5px;font-weight:700;margin-top:4px}
.qtext{color:var(--ink);font-size:13.5px;margin:10px 0;line-height:1.6}

@media (max-width:640px){
  .app{padding:14px 14px 80px}
  .topbar{padding:12px 14px;border-radius:18px;top:10px}
  .brand-text b{font-size:13.5px}
  .topbar-user{font-size:10.5px;padding:7px 11px;max-width:120px}
  .btn-logout{width:40px;height:40px;font-size:16px}
  .welcome{padding:22px 20px;border-radius:22px}
  .welcome h2{font-size:20px}
  .feature-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .feature-btn{padding:16px 14px;border-radius:18px;gap:10px}
  .feature-ic{width:44px;height:44px;font-size:20px;border-radius:14px}
  .feature-btn b{font-size:13px}
  .feature-btn small{font-size:10.5px}
  .mini-stats{grid-template-columns:repeat(2,1fr);gap:10px}
  .mini-stat{padding:13px;gap:10px}
  .mini-stat .ico{width:36px;height:36px;font-size:16px}
  .mini-stat b{font-size:18px}
  .card{padding:18px;border-radius:20px}
  .view-head h2{font-size:18px}
  .form-grid{grid-template-columns:1fr;gap:12px}
  .toast{top:auto;bottom:20px;right:14px;left:14px;max-width:none}
  .row-act{flex-direction:column}
  .row-act .btn{width:100%}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginView" class="login-page">
  <form id="loginForm" class="login-card">
    <div class="login-mark">🛡️</div>
    <h1>Tech BD Admin</h1>
    <div class="tag">SECURE CONTROL PANEL</div>
    <div class="field">
      <label>📧 Admin Email</label>
      <input id="email" type="email" required value="mustafizurmd459@gmail.com" autocomplete="email">

async function hmacSha(keyBytes, msg){
  const k = await crypto.subtle.importKey('raw', keyBytes, { name:'HMAC', hash:'SHA-256' }, false, ['sign']);
  return new Uint8Array(await crypto.subtle.sign('HMAC', k, new TextEncoder().encode(msg)));
}
async function verifyInit(initData){
  const p = new URLSearchParams(String(initData || '')), hash = p.get('hash'); p.delete('hash');
  if (!hash) return null;
  const str = [...p.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1).map(([k, v]) => k + '=' + v).join('\n');
  const secret = await hmacSha(new TextEncoder().encode('WebAppData'), TGE.tok);
  const h = [...await hmacSha(secret, str)].map(b => b.toString(16).padStart(2, '0')).join('');
  if (h !== hash || Date.now() / 1000 - (+p.get('auth_date') || 0) > 7 * 86400) return null;
  try{ return JSON.parse(p.get('user')); }catch(e){ return null; }
}

/* ═══════════════ USER BALANCE (admin) ═══════════════ */
async function userBal(uid, excludeId){
  const g = n => db.collection(n).where('uid','==',uid).get();
  const [td,av,bo,pu,rb,aj,wd,gw] = await Promise.all(['taskDone','adViews','bonuses','promoUse','refBonuses','adjustments','withdrawals'].map(g).concat(db.collection('gameWins').where('uid','==',uid).get().catch(() => ({ forEach(){} }))));
  let e = 0, sp = 0;
  [td,av,bo,pu,gw].forEach(s => s.forEach(d => e += +d.data().reward || 0));
  [rb,aj].forEach(s => s.forEach(d => e += +d.data().amount || 0));
  wd.forEach(d => { if (d.id !== excludeId && d.data().status !== 'rejected') sp += +d.data().amount || 0; });
  return Math.round((e - sp) * 100) / 100;
}
async function adjustBal(uid){
  const u = cache.users.find(x => x.id === uid) || {};
  let cur = 0;
  try{ cur = await userBal(uid); }catch(e){ return toast('ব্যালেন্স পড়া যায়নি: '+e.message, 'err'); }
  const v = prompt(`${u.name || uid}\nবর্তমান ব্যালেন্স: ৳${cur.toFixed(2)}\n\nকত টাকা যোগ করবেন? (কমাতে মাইনাস দিন, যেমন -2)`, '');
  if (v === null) return;
  const amt = Math.round(parseFloat(v) * 100) / 100;
  if (!isFinite(amt) || amt === 0 || Math.abs(amt) > 100000) return toast('সঠিক পরিমাণ দিন', 'err');
  const note = (prompt('কারণ (optional):', '') || '').slice(0, 120);
  const ok = await confirmDialog('Balance পরিবর্তন?', `${u.name || uid}: ${amt > 0 ? '+' : ''}${amt.toFixed(2)} (নতুন ব্যালেন্স ≈ ৳${Math.max(0, cur + amt).toFixed(2)})`, 'Confirm');
  if (!ok) return;
  try{
    await addDoc('adjustments', { uid, amount: amt, note, by: (auth.currentUser?.email || '') });
    toast(`✅ ব্যালেন্স ${amt > 0 ? 'যোগ' : 'কমানো'} হয়েছে`);
    publishLeaderboard(true);
  }catch(e){ toast('ব্যর্থ: '+e.message, 'err'); }
}

/* =============== PAYMENT PROOFS (public record of real payouts) =============== */
const maskName = n => { n = String(n || '').trim(); return n ? (n.length > 2 ? n[0] + '***' + n.slice(-1) : n[0] + '***') : 'User'; };
const maskAcct = a => { a = String(a || '').replace(/\s+/g, ''); return a.length >= 8 ? a.slice(0, 3) + '****' + a.slice(-3) : (a.length >= 3 ? '****' + a.slice(-2) : '****'); };
function payoutData(id, w){
  return { name: maskName(w.name), acct: maskAcct(w.address), method: String(w.method || ''), amount: +w.amount || 0,
    ref: String(id).slice(0, 6).toUpperCase(), txid: String(w.txid || '').trim().slice(0, 40), ts: w.reviewedAt || w.ts || TS() };
}
/** One public record per approved withdrawal (document id = withdrawal id, so it can never be duplicated). */
async function publishPayout(id, w){
  const d = payoutData(id, w), ref = db.collection('payoutsFeed').doc(id);
  /* one transaction: the admin panel and bot.py can approve at the same moment, only ONE of them creates the record */
  const created = await db.runTransaction(async tx => {
    const ex = await tx.get(ref);
    if (ex.exists){ const upd = { acct: d.acct, ref: d.ref, method: d.method }; if (d.txid) upd.txid = d.txid; tx.set(ref, upd, { merge: true }); return false; }
    tx.set(ref, d); return true;
  });
  if (!created) return false;
  await db.collection('settings').doc('payStats').set({ totalAmount: firebase.firestore.FieldValue.increment(d.amount), count: firebase.firestore.FieldValue.increment(1), last: TS() }, { merge: true }).catch(() => {});
  if (TGE.proof && TGE.tok){
    const ms = tsMs(d.ts), when = new Date(ms > 0 && isFinite(ms) ? ms : Date.now()).toLocaleString('en-GB', { timeZone: 'Asia/Dhaka', day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    await tgTry('sendMessage', { chat_id: TGE.proof, parse_mode: 'HTML', disable_web_page_preview: true,
      text: `✅ <b>Payment Sent</b>\n👤 ${tEsc(d.name)}\n🏦 ${tEsc(d.method)} • ${tEsc(d.acct)}\n💰 <b>BDT ${d.amount.toFixed(2)}</b>\n🕒 ${when} (BST)\n🧾 Ref #${d.ref}${d.txid ? ' • Txn: <code>' + tEsc(d.txid) + '</code>' : ''}` });
  }
  return true;
}
async function wdTx(id){
  const w = cache.withdrawals.find(x => x.id === id); if (!w) return;
  const v = (prompt('Transaction ID / Reference (পেমেন্টের প্রমাণ):', w.txid || '') || '').trim().slice(0, 40);
  if (!v) return;
  try{
    await db.collection('withdrawals').doc(id).update({ txid: v });
    w.txid = v; await publishPayout(id, w);
    toast('✅ Txn ID সেভ হয়েছে, Payment Proofs-এ দেখাবে'); go('withdrawals');
  }catch(e){ toast('ব্যর্থ: ' + e.message, 'err'); }
}
async function proofRebuild(){
  if (!await confirmDialog('Payment Proofs সিঙ্ক করবেন?', 'সব Approved withdrawal থেকে Payment Proofs আর মোট হিসাব নতুন করে তৈরি হবে। আগের অসম্পূর্ণ/ডুপ্লিকেট রেকর্ড মুছে যাবে। শুধু সত্যিকারের পেমেন্টই দেখানো হবে।', 'সিঙ্ক করুন')) return;
  try{
    const snap = await db.collection('withdrawals').where('status', '==', 'approved').get(), ids = new Set();
    let total = 0, n = 0;
    for (const d of snap.docs){
      const w = d.data(); ids.add(d.id); n++; total += +w.amount || 0;
      const ref = db.collection('payoutsFeed').doc(d.id), ex = await ref.get(), x = payoutData(d.id, w);
      if (ex.exists){ const u = { name: x.name, acct: x.acct, ref: x.ref, method: x.method, amount: x.amount }; if (x.txid) u.txid = x.txid; if (w.reviewedAt) u.ts = w.reviewedAt; await ref.set(u, { merge: true }); }
      else await ref.set(x);
    }
    const old = await db.collection('payoutsFeed').get(); let removed = 0;
    for (const d of old.docs) if (!ids.has(d.id)){ await d.ref.delete(); removed++; }
    await db.collection('settings').doc('payStats').set({ totalAmount: Math.round(total * 100) / 100, count: n, last: TS() });
    cache.payoutCount = n;
    toast('✅ ' + n + 'টি পেমেন্ট প্রুফ তৈরি' + (removed ? ' (' + removed + 'টি পুরনো রেকর্ড সরানো হয়েছে)' : ''));
  }catch(e){ toast('ব্যর্থ: ' + e.message, 'err'); }
}
async function wdAct(id, status){
  const ok = await confirmDialog(
    status === 'approved' ? 'Approve Request?' : 'Reject Request?',
    status === 'approved' ? 'এই রিকোয়েস্ট অ্যাপ্রুভ করবেন?' : 'এই রিকোয়েস্ট রিজেক্ট করবেন?',
    status === 'approved' ? '✓ Approve' : '✗ Reject'
  );
  if (!ok) return;
  const note = status === 'rejected' ? (prompt('কারণ লিখুন (optional):') || '') : '';
  const txid = status === 'approved' ? (prompt('Transaction ID / Reference লিখুন (পেমেন্টের প্রমাণ — Payment Proofs-এ দেখাবে):') || '').trim().slice(0, 40) : '';
  try{
    await updateDoc('withdrawals', id, { status, note, reviewedAt: TS(), ...(txid ? { txid } : {}) });
    if (status === 'approved'){ const w0 = cache.withdrawals.find(x => x.id === id); if (w0) await publishPayout(id, { ...w0, txid, reviewedAt: new Date() }).catch(() => {}); }
    toast(status==='approved' ? '✓ Approve হয়েছে' : '✗ Reject হয়েছে');
    publishLeaderboard(true);
    await refreshAll(); go('withdrawals');
  }catch(e){ toast('ব্যর্থ: '+e.message, 'err'); }
}

function pmUrl(inp){ const r = inp.closest('.pm-row'); delete r.dataset.d; const im = r.querySelector('.pm-img'); im.src = inp.value.trim(); im.style.visibility = inp.value.trim() ? 'visible' : 'hidden'; }
function pmFile(inp){
  const f = inp.files && inp.files[0]; if (!f) return;
  const r = inp.closest('.pm-row'), im = new Image(), u = URL.createObjectURL(f);
  im.onload = () => {
    const c = document.createElement('canvas'); c.width = c.height = 96;
    const x = c.getContext('2d'), k = Math.min(96 / im.width, 96 / im.height);
    x.clearRect(0,0,96,96); x.drawImage(im, (96 - im.width*k)/2, (96 - im.height*k)/2, im.width*k, im.height*k);
    let d = c.toDataURL('image/png'); if (d.length > 60000) d = c.toDataURL('image/jpeg', .85);
    URL.revokeObjectURL(u);
    if (d.length > 65000) return toast('ছবি অনেক বড়', 'err');
    r.dataset.d = d; r.querySelector('.pm-l').value = '';
    const p = r.querySelector('.pm-img'); p.src = d; p.style.visibility = 'visible';
  };
  im.onerror = () => toast('ছবি পড়া যায়নি', 'err');
  im.src = u;
}

const GAME_DEF = [{r:3,c:3,s:24},{r:4,c:3,s:27},{r:4,c:4,s:30},{r:5,c:4,s:34},{r:5,c:4,s:36},{r:6,c:5,s:40},{r:6,c:5,s:42},{r:7,c:5,s:46},{r:7,c:6,s:49},{r:8,c:6,s:54}];
const GAME_MAX = 5000;
function gameShots(r, c){ return Math.round(5.5 * r + 7 + Math.max(0, c - 4) * 1.5); }
function gameNext(prev, k){
  let r = prev.r, c = prev.c, s;
  if (r >= 9 && c >= 6){ s = Math.max(Math.round(gameShots(9, 6) * 0.7), prev.s - 1); }
  else { if (k % 2 === 0 && r < 9) r++; else if (c < 6) c++; else r = Math.min(9, r + 1); s = gameShots(r, c); }
  return { r, c, s };
}
function gameLvRow(l, i){
  return `<div class="gl-row" style="display:flex;gap:6px;align-items:center;margin-top:6px">
    <b class="gl-n" style="width:30px;text-align:center">${i + 1}</b>

    <input class="gl-c" type="number" min="2" max="6" value="${l.c}" style="width:64px">
    <input class="gl-s" type="number" min="3" max="300" value="${l.s}" style="width:72px">
    <button class="btn red" type="button" onclick="gameLvDel(this)">🗑</button>
  </div>`;
}
function gameLvCount(){
  const n = document.querySelectorAll('#gl_list .gl-row').length;
  document.querySelectorAll('#gl_list .gl-row').forEach((row, i) => { row.querySelector('.gl-n').textContent = i + 1; });
  const e = $('gl_cnt'); if (e) e.textContent = n;
}
function gameLvRead(){
  const out = [];
  document.querySelectorAll('#gl_list .gl-row').forEach(row => {
    out.push({ r: Math.floor(+row.querySelector('.gl-r').value), c: Math.floor(+row.querySelector('.gl-c').value), s: Math.floor(+row.querySelector('.gl-s').value) });
  });
  return out;
}
function gameLvAdd(n){
  n = Math.floor(+n);
  if (!(n >= 1)) return toast('কয়টা লেভেল যোগ হবে সেটা লিখুন', 'err');
  const cur = gameLvRead();
  if (cur.length + n > GAME_MAX) return toast('সর্বোচ্চ ' + GAME_MAX + 'টি লেভেল', 'err');
  let prev = cur.length ? cur[cur.length - 1] : { r: 2, c: 3, s: 20 }, html = '';
  for (let k = 0; k < n; k++){
    prev = gameNext(prev, cur.length + k);
    html += gameLvRow(prev, cur.length + k);
  }
  const box = $('gl_list');
  box.insertAdjacentHTML('beforeend', html);
  gameLvCount();
  box.scrollTop = box.scrollHeight;
  toast(n + 'টি লেভেল যোগ হয়েছে। Save চাপুন');
}
function gameLvDel(btn){
  if (document.querySelectorAll('#gl_list .gl-row').length <= 1) return toast('কমপক্ষে ১টা লেভেল রাখুন', 'err');
  btn.closest('.gl-row').remove(); gameLvCount();
}
function gameLvReset(){
  if (!confirm('সব লেভেল মুছে ডিফল্ট ১০টা লেভেল বসাবে। ঠিক আছে?')) return;
  $('gl_list').innerHTML = GAME_DEF.map(gameLvRow).join(''); gameLvCount();
}

async function gameSave(){
  const rew = Math.round(parseFloat($('gm_rew').value) * 100) / 100, day = Math.floor(parseFloat($('gm_day').value));
  if (!isFinite(rew) || rew < 0 || rew > 1000) return toast('Reward ঠিক নয়', 'err');
  if (!isFinite(day) || day < 1 || day > 50) return toast('Daily limit ১ থেকে ৫০ এর মধ্যে দিন', 'err');
  const levels = gameLvRead();
  if (!levels.length || levels.length > GAME_MAX) return toast('লেভেল ১ থেকে ' + GAME_MAX + 'টির মধ্যে হতে হবে', 'err');
  for (let i = 0; i < levels.length; i++){
    const l = levels[i];
    if (!(l.r >= 1 && l.r <= 9)) return toast('লেভেল ' + (i + 1) + ': ROWS ১ থেকে ৯', 'err');
    if (!(l.c >= 2 && l.c <= 6)) return toast('লেভেল ' + (i + 1) + ': COLORS ২ থেকে ৬', 'err');
    if (!(l.s >= 3 && l.s <= 300)) return toast('লেভেল ' + (i + 1) + ': SHOTS ৩ থেকে ৩০০', 'err');
  }
  try{
    await db.collection('settings').doc('app').set({ gameOn: $('gm_on').checked, gameReward: rew, gameDaily: day, gameAdBefore: $('gm_ab').checked, gameAdAfter: $('gm_aa').checked, gameLevels: levels }, { merge: true });
    toast('Game সেভ হয়েছে ✅ (' + levels.length + 'টি লেভেল)');
  }catch(e){ toast('ব্যর্থ: ' + e.message, 'err'); }
}

function aiAddRow(){
  $('aiList').insertAdjacentHTML('beforeend', aiRowHtml({ preset:'openai', name:'OpenAI', model:'gpt-4o-mini', baseUrl:'https://api.openai.com/v1' }));
}
function aiPick(sel){
  const row = sel.closest('.ai-row'), pr = AI_PRESETS[sel.value]; if (!pr) return;
  row.dataset.preset = sel.value;
  row.querySelector('.ai-n').value = pr.label.slice(0,24);
  row.querySelector('.ai-m').value = pr.model;
  row.querySelector('.ai-b').value = pr.baseUrl;
  row.querySelector('.ai-bw').style.display = pr.type === 'openai' ? '' : 'none';
}
function aiMove(btn, dir){
  const row = btn.closest('.ai-row'), sib = dir < 0 ? row.previousElementSibling : row.nextElementSibling;
  if (!sib) return;
  dir < 0 ? sib.before(row) : sib.after(row);
}
function aiDel(btn){ btn.closest('.ai-row').remove(); }
function aiReadRow(row){
  const pr = AI_PRESETS[row.dataset.preset] || AI_PRESETS.custom;
  return {
    type: pr.type, preset: row.dataset.preset,
    name: row.querySelector('.ai-n').value.trim().slice(0,24) || pr.label.slice(0,24),
    model: row.querySelector('.ai-m').value.trim().slice(0,120),
    baseUrl: pr.type === 'openai' ? row.querySelector('.ai-b').value.trim().replace(/\/+$/,'') : '',
    key: row.querySelector('.ai-k').value.trim(),
    on: row.querySelector('.ai-on').checked
  };
}
function aiRace(p, ms){
  let t; return Promise.race([p, new Promise((_, rej) => { t = setTimeout(() => rej(new Error('timeout')), ms); })]).finally(() => clearTimeout(t));
}
async function aiModels(btn){
  const row = btn.closest('.ai-row'), p = aiReadRow(row);
  if (!p.key) return toast('আগে API key দিন', 'err');
  { const h = aiKeyHint(p); if (h) return toast(h, 'err'); }
  const old = btn.textContent; btn.textContent = '…'; btn.disabled = true;
  try{
    let r, j, ids = [];
    if (p.type === 'anthropic'){
      r = await aiRace(fetch('https://api.anthropic.com/v1/models?limit=100', { headers:{ 'x-api-key':p.key, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' } }), 15000);
      j = await r.json(); if (!r.ok) throw new Error(r.status + ': ' + ((j.error && j.error.message) || 'error'));
      ids = (j.data || []).map(x => x.id);
    } else if (p.type === 'gemini'){
      r = await aiRace(fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=100', { headers:{ 'x-goog-api-key':p.key } }), 15000);
      j = await r.json(); if (!r.ok) throw new Error(r.status + ': ' + ((j.error && j.error.message) || 'error'));
      ids = (j.models || []).filter(x => (x.supportedGenerationMethods || []).indexOf('generateContent') >= 0).map(x => String(x.name).replace(/^models\//, ''));
    } else {
      if (!/^https:\/\/[^\s"'<>]{3,200}$/.test(p.baseUrl)) throw new Error('Base URL ঠিক নয়');
      r = await aiRace(fetch(p.baseUrl.replace(/\/chat\/completions$/, '') + '/models', { headers:{ 'Authorization':'Bearer ' + p.key } }), 15000);
      j = await r.json(); if (!r.ok) throw new Error(r.status + ': ' + ((j.error && (j.error.message || j.error)) || 'error'));
      ids = (j.data || []).map(x => x.id);
    }
    ids = ids.filter(Boolean).sort();
    if (!ids.length) throw new Error('কোনো মডেল পাওয়া যায়নি');
    row.querySelector('datalist').innerHTML = ids.map(i => `<option value="${esc(i)}">`).join('');
    const cur = row.querySelector('.ai-m').value.trim();
    toast(ids.indexOf(cur) < 0
      ? '⚠️ "' + cur + '" এই key-তে নেই। ' + ids.length + 'টি মডেল আছে, Model ঘর মুছে ট্যাপ করে বেছে নিন'
      : '✅ ' + ids.length + 'টি মডেল পাওয়া গেছে, "' + cur + '" ঠিক আছে', ids.indexOf(cur) < 0 ? 'err' : undefined);
  }catch(e){ toast('❌ ' + p.name + ': ' + String(e.message || e).slice(0,120), 'err'); }
  btn.textContent = old; btn.disabled = false;
}
async function aiTest(btn){
  const p = aiReadRow(btn.closest('.ai-row'));
  if (!p.key) return toast('API key দিন', 'err');
  { const h = aiKeyHint(p); if (h) return toast(h, 'err'); }
  if (!p.model) return toast('Model লিখুন', 'err');
  if (p.type === 'openai' && !/^https:\/\/[^\s"'<>]{3,200}$/.test(p.baseUrl)) return toast('Base URL ঠিক নয় (https:// দিয়ে শুরু)', 'err');
  const old = btn.textContent; btn.textContent = '…'; btn.disabled = true;
  try{
    let r, j, txt = '';
    if (p.type === 'anthropic'){
      r = await aiRace(fetch('https://api.anthropic.com/v1/messages', { method:'POST', headers:{ 'Content-Type':'application/json', 'x-api-key':p.key, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' }, body: JSON.stringify({ model:p.model, max_tokens:20, messages:[{ role:'user', content:'Reply with the single word OK' }] }) }), 20000);
      j = await r.json(); if (!r.ok) throw new Error(r.status + ': ' + ((j.error && j.error.message) || 'error'));
      txt = ((j.content || [])[0] || {}).text || '';
    } else if (p.type === 'gemini'){
      r = await aiRace(fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(p.model) + ':generateContent', { method:'POST', headers:{ 'Content-Type':'application/json', 'x-goog-api-key':p.key }, body: JSON.stringify({ contents:[{ role:'user', parts:[{ text:'Reply with the single word OK' }] }] }) }), 20000);
      j = await r.json(); if (!r.ok) throw new Error(r.status + ': ' + ((j.error && j.error.message) || 'error'));
      txt = (((j.candidates || [])[0] || {}).content || {}).parts ? j.candidates[0].content.parts.map(x => x.text || '').join('') : '';
    } else {
      const body = { model:p.model, messages:[{ role:'user', content:'Reply with the single word OK' }] };
      if (/api\.openai\.com/.test(p.baseUrl)) body.max_completion_tokens = 50; else body.max_tokens = 20;
      r = await aiRace(fetch(p.baseUrl.replace(/\/chat\/completions$/,'') + '/chat/completions', { method:'POST', headers:{ 'Authorization':'Bearer ' + p.key, 'Content-Type':'application/json' }, body: JSON.stringify(body) }), 20000);
      j = await r.json(); if (!r.ok) throw new Error(r.status + ': ' + ((j.error && (j.error.message || j.error)) || 'error'));
      txt = (((j.choices || [])[0] || {}).message || {}).content || '';
    }
    toast('✅ ' + p.name + ' কাজ করছে' + (txt ? ': ' + String(txt).slice(0,30) : ''));
  }catch(e){ toast('❌ ' + p.name + ': ' + String(e.message || e).slice(0,120), 'err'); }
  btn.textContent = old; btn.disabled = false;
}
async function aiSaveAll(){

    const b0 = $('bt_b'); b0.disabled = true;
    try{
      if (one && !cache.tg[uid]) throw new Error('এই ইউজারের Telegram যুক্ত নেই');
      await addDoc('broadcasts', { text, target: one ? 'one' : 'all', ...(one ? { tgId: String(cache.tg[uid].tgId) } : {}), status: 'queued', sent: 0, failed: 0, by: auth.currentUser?.email || '' });
      $('bt_m').value = ''; toast('✅ bot.py-এর কিউতে গেছে — পেজ বন্ধ করলেও পাঠানো চলবে');
    }catch(e){ toast('ব্যর্থ: ' + (e.message || e.code), 'err'); }
    b0.disabled = false; return;
  }
  if (!await confirmDialog('Bot মেসেজ পাঠাবেন?', one ? 'এই ইউজারকে মেসেজ যাবে।' : 'বটের সব ইউজারের ইনবক্সে মেসেজ যাবে। শেষ না হওয়া পর্যন্ত পেজ খোলা রাখুন।', 'Send')) return;
  const b = $('bt_b'); b.disabled = true;
  const ids = new Set();
  try{
    if (one){ const l = cache.tg[uid]; if (!l) throw new Error('এই ইউজারের Telegram যুক্ত নেই'); ids.add(String(l.tgId)); }
    else {
      (await db.collection('botUsers').get()).forEach(d => { if (d.data().active !== false) ids.add(d.id); });
      Object.values(cache.tg).forEach(l => ids.add(String(l.tgId)));
    }
    let sent = 0, failed = 0, n = 0;
    for (const id of ids){
      b.textContent = `পাঠানো হচ্ছে… ${++n}/${ids.size}`;
      try{ await tgApi('sendMessage', { chat_id: id, text: '📢 ' + text, disable_web_page_preview: true }); sent++; }
      catch(e){
        if (e.code === 429){ await sleep(((e.retry || 2) + 1) * 1000); try{ await tgApi('sendMessage', { chat_id: id, text: '📢 ' + text }); sent++; }catch(_){ failed++; } }
        else { failed++; if (e.code === 403) db.collection('botUsers').doc(id).set({ active:false }, { merge:true }).catch(()=>{}); }
      }
      await sleep(50);
    }
    await addDoc('broadcasts', { text, target: one ? 'one' : 'all', sent, failed, by: auth.currentUser?.email || '' });
    toast(`✅ পাঠানো: ${sent}, ব্যর্থ: ${failed}`);
    $('bt_m').value = '';
  }catch(e){ toast('ব্যর্থ: ' + (e.message || e.code), 'err'); }
  b.disabled = false; b.textContent = '🤖 Bot এ পাঠান';
}

async function changeEmail(){
  const u = auth.currentUser;
  if (!u) return toast('লগইন নেই', 'err');
  const ne = $('newEmail').value.trim().toLowerCase();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(ne)) return toast('সঠিক ইমেইল দিন', 'err');
  const pass = prompt('নিরাপত্তার জন্য বর্তমান পাসওয়ার্ড দিন:');
  if (!pass) return;
  try{
    const cred = firebase.auth.EmailAuthProvider.credential(u.email, pass);
    await u.reauthenticateWithCredential(cred);
    await u.updateEmail(ne);
    toast('✅ ইমেইল আপডেট হয়েছে → ' + ne);
  } catch(e){ toast('ব্যর্থ: ' + (e.code || e.message), 'err'); }
}
async function changePass(){
  const u = auth.currentUser;
  if (!u) return toast('লগইন নেই', 'err');
  const op = $('oldPass').value, np = $('newPass').value, np2 = $('newPass2').value;
  if (!op || !np || !np2) return toast('সব ঘর পূরণ করুন', 'err');
  if (np.length < 6) return toast('নতুন পাসওয়ার্ড ৬+ অক্ষর দিন', 'err');
  if (np !== np2) return toast('দুটি পাসওয়ার্ড মিলছে না', 'err');
  try{
    const cred = firebase.auth.EmailAuthProvider.credential(u.email, op);
    await u.reauthenticateWithCredential(cred);
    await u.updatePassword(np);
    toast('✅ পাসওয়ার্ড পরিবর্তন হয়েছে');
    $('oldPass').value = ''; $('newPass').value = ''; $('newPass2').value = '';
  } catch(e){
    let msg = e.code || e.message;
    if (e.code === 'auth/wrong-password') msg = 'বর্তমান পাসওয়ার্ড ভুল';
    if (e.code === 'auth/weak-password') msg = 'পাসওয়ার্ড দুর্বল (৬+ অক্ষর)';
    toast('ব্যর্থ: ' + msg, 'err');

}

function fbCopy(t){
  try{ navigator.clipboard.writeText(t); }
  catch(e){ const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); }
  toast('Copied ✅', 'info');
}
async function fbAct(id, status){
  const ok = await confirmDialog(
    status === 'approved' ? 'Approve ID?' : 'Reject ID?',
    status === 'approved' ? 'অ্যাপ্রুভ করলে ইউজারের একাউন্টে টাকা যোগ হবে।' : 'রিজেক্ট করলে ইউজারকে রিজেক্ট মেসেজ যাবে।',
    status === 'approved' ? '✓ Approve' : '✗ Reject'
  );
  if (!ok) return;
  const note = status === 'rejected' ? (prompt('কারণ লিখুন (optional):') || '').slice(0, 120) : '';
  try{
    const ref = db.collection('fbSales').doc(id);
    await db.runTransaction(async tx => {
      const snap = await tx.get(ref);
      if (!snap.exists || snap.data().status !== 'pending') throw new Error('এটি আগেই প্রসেস হয়েছে');
      const d = snap.data();
      if (status === 'approved'){
        const amt = Math.round((+d.rate || 0) * 100) / 100;
        if (!(amt > 0)) throw new Error('রেট সঠিক নয়');
        tx.set(db.collection('adjustments').doc('fb_' + id), { uid: d.uid, amount: amt, note: 'Facebook ID Sell: ' + id, by: (auth.currentUser?.email || ''), ts: TS() });
      }
      tx.update(ref, { status, note, reviewedAt: TS() });
    });
    toast(status === 'approved' ? '✓ Approve হয়েছে, টাকা যোগ হয়েছে' : '✗ Reject হয়েছে');
    publishLeaderboard(true);
    await refreshAll(); go('fbsell');
  }catch(e){ toast('ব্যর্থ: ' + e.message, 'err'); }
}

    publishLeaderboard(true);
    await refreshAll(); go('igsell');
  }catch(e){ toast('ব্যর্থ: ' + e.message, 'err'); }
}

/* ═══════════════ GMAIL SELL (admin) ═══════════════ */
async function viewGmSell(){
  let st = {};
  try{ st = (await db.collection('settings').doc('app').get()).data() || {}; }catch(e){}
  const all  = cache.gmSales || [];
  const pend = all.filter(x => x.status === 'pending');
  const done = all.filter(x => x.status !== 'pending');
  const okN  = all.filter(x => x.status === 'approved').length;
  const on   = st.gmSellOn !== false;
  return `
    ${viewHead('✉️','Gmail Sell','রেট, পাসওয়ার্ড ও সাবমিট করা Gmail',
      `<span class="pill-stat warn">${pend.length} Pending</span>
       <span class="pill-stat info">${okN} Approved</span>`
    )}
    <div class="card">
      <h3 class="blue"><span class="ic">⚙️</span> সেটিংস</h3>
      <div class="form-grid">
        <div class="field"><label>প্রতি Gmail-এর রেট (BDT)</label><input id="gm_rate" type="number" step="0.01" min="0" value="${esc(st.gmSellRate ?? '')}" placeholder="যেমন 5.00"></div>
        <div class="field"><label>Gmail-এ সেট করার পাসওয়ার্ড</label><input id="gm_pass" maxlength="40" value="${esc(st.gmSellPass ?? '')}" placeholder="TECHBD2024"></div>
        <div class="field"><label>Gmail জমা নেওয়া</label>
          <select id="gm_on"><option value="1" ${on ? 'selected' : ''}>চালু (ON)</option><option value="0" ${on ? '' : 'selected'}>বন্ধ (OFF)</option></select>
        </div>
      </div>
      <button class="btn" style="margin-top:16px" onclick="saveGmSell()">💾 Save</button>
    </div>
    <div class="card">
      <h3 class="amber"><span class="ic">⏳</span> Pending (${pend.length})</h3>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>User</th><th>Gmail</th><th>Password</th><th>Rate</th><th>Time</th><th>Actions</th></tr></thead>
          <tbody>${pend.map(x => `
            <tr>
              <td><b>${esc(x.name || x.uid)}</b></td>
              <td><span class="code-snip">${esc(x.gmail || x.id)}</span> <button class="btn sm" data-t="${esc(x.gmail || x.id)}" onclick="gmCopy(this.dataset.t)">Copy</button></td>
              <td><span class="code-snip">${esc(x.pw)}</span> <button class="btn sm" data-t="${esc(x.pw)}" onclick="gmCopy(this.dataset.t)">Copy</button></td>
              <td><b style="color:#b45309">৳${(+x.rate || 0).toFixed(2)}</b></td>
              <td>${x.ts ? new Date(tsMs(x.ts)).toLocaleString() : '—'}</td>
              <td class="row-act">
                <button class="btn sm" onclick="gmAct('${esc(x.id)}','approved')">✓ Approve</button>
                <button class="btn sm red" onclick="gmAct('${esc(x.id)}','rejected')">✗ Reject</button>
              </td>
            </tr>`).join('') || '<tr><td colspan="6" class="empty"><span class="em">✅</span>Pending নেই</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>
    <div class="card">
      <h3><span class="ic">📜</span> History (${done.length})</h3>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>User</th><th>Gmail</th><th>Rate</th><th>Status</th><th>Time</th></tr></thead>
          <tbody>${done.slice(0,150).map(x => `
            <tr>
              <td>${esc(x.name || x.uid)}</td>
              <td><span class="code-snip">${esc(x.gmail || x.id)}</span></td>
              <td>৳${(+x.rate || 0).toFixed(2)}</td>
              <td>${x.status === 'approved' ? '<span class="badge ok">Approved</span>' : '<span class="badge rej">Rejected</span>'}${x.note ? ` <small style="opacity:.6">(${esc(x.note)})</small>` : ''}</td>
              <td>${x.ts ? new Date(tsMs(x.ts)).toLocaleString() : '—'}</td>
            </tr>`).join('') || '<tr><td colspan="5" class="empty"><span class="em">📜</span>—</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>
  `;
}
async function saveGmSell(){
  const rate = Math.round(parseFloat($('gm_rate').value) * 100) / 100;
  const pass = $('gm_pass').value.trim().slice(0, 40);
  const on   = $('gm_on').value === '1';
  if (!isFinite(rate) || rate < 0 || rate > 100000) return toast('সঠিক রেট দিন', 'err');
  try{
    await setDoc('settings', 'app', { gmSellRate: rate, gmSellPass: pass, gmSellOn: on });
    toast('✅ সেভ হয়েছে');
    go('gmsell');
  }catch(e){ toast('ব্যর্থ: ' + e.message, 'err'); }
}
function gmCopy(t){
  try{ navigator.clipboard.writeText(t); }
  catch(e){ const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); }
  toast('Copied ✅', 'info');
}
async function gmAct(id, status){
  const ok = await confirmDialog(
    status === 'approved' ? 'Approve Gmail?' : 'Reject Gmail?',
    status === 'approved' ? 'অ্যাপ্রুভ করলে ইউজারের একাউন্টে টাকা যোগ হবে।' : 'রিজেক্ট করলে ইউজারকে রিজেক্ট মেসেজ যাবে।',
    status === 'approved' ? '✓ Approve' : '✗ Reject'
  );
  if (!ok) return;
  const note = status === 'rejected' ? (prompt('কারণ লিখুন (optional):') || '').slice(0, 120) : '';
  try{
    const ref = db.collection('gmSales').doc(id);
    await db.runTransaction(async tx => {
      const snap = await tx.get(ref);
      if (!snap.exists || snap.data().status !== 'pending') throw new Error('এটি আগেই প্রসেস হয়েছে');
      const d = snap.data();
      if (status === 'approved'){
        const amt = Math.round((+d.rate || 0) * 100) / 100;
        if (!(amt > 0)) throw new Error('রেট সঠিক নয়');
        tx.set(db.collection('adjustments').doc('gm_' + id), { uid: d.uid, amount: amt, note: 'Gmail Sell: ' + id, by: (auth.currentUser?.email || ''), ts: TS() });
      }
      tx.update(ref, { status, note, reviewedAt: TS() });
    });
    toast(status === 'approved' ? '✓ Approve হয়েছে, টাকা যোগ হয়েছে' : '✗ Reject হয়েছে');
    publishLeaderboard(true);
    await refreshAll(); go('gmsell');
  }catch(e){ toast('ব্যর্থ: ' + e.message, 'err'); }
}

/* ═══════════════ SHARED ═══════════════ */
async function delRow(col, id){
  const ok = await confirmDialog('Delete Item?', 'আপনি কি নিশ্চিত? এটি মুছে ফেলবেন?', '🗑 Delete');
  if (!ok) return;
  try{
    await delDoc(col, id);
    toast('মুছে ফেলা হয়েছে ✅');
    await refreshAll();
    if (col === 'promos') go('promos');
    else if (col === 'ads') go('ads');
    else if (col === 'tasks') go('tasks');
    else if (col === 'banners') go('banners');
    else if (col === 'announcements') go('announce');
    else if (col === 'supportQ' || col === 'faq') go('support');
    else showHome();
  }catch(e){ toast('ব্যর্থ: '+e.message, 'err'); }
}
async function toggleActive(col, id, active){
  try{
    await updateDoc(col, id, { active });
    await refreshAll();
    if (col === 'ads') go('ads');
    else if (col === 'tasks') go('tasks');
    else if (col === 'banners') go('banners');
    else showHome();
  }catch(e){ toast('ব্যর্থ: '+e.message, 'err'); }
}
</script>
<script type="text/plain" id="rulesTxt">
rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function signedIn() { return request.auth != null; }
    function isAdmin() { return signedIn() && request.auth.token.email == "mustafizurmd459@gmail.com"; }
    function mine() { return signedIn() && request.resource.data.uid == request.auth.uid; }
    function appSettings() {
      return exists(/databases/$(database)/documents/settings/app)
        ? get(/databases/$(database)/documents/settings/app).data : {};
    }

    match /ads/{id}           { allow read: if signedIn(); allow write: if isAdmin(); }
    match /tasks/{id}         { allow read: if signedIn(); allow write: if isAdmin(); }
    match /banners/{id}       { allow read: if signedIn(); allow write: if isAdmin(); }
    match /announcements/{id} { allow read: if signedIn(); allow write: if isAdmin(); }
    match /faq/{id}           { allow read: if signedIn(); allow write: if isAdmin(); }
    match /settings/{id}      { allow read: if signedIn(); allow write: if isAdmin(); }
    match /promos/{id}        { allow read: if signedIn(); allow write: if isAdmin(); }

    match /users/{uid} {
      allow read: if signedIn();
      allow create: if signedIn() && request.auth.uid == uid && !('banned' in request.resource.data);
      allow update: if (signedIn() && request.auth.uid == uid
                        && !request.resource.data.diff(resource.data).affectedKeys().hasAny(['banned']))
                    || isAdmin();
    }

    match /private/{id}    { allow read, write: if isAdmin(); }
    match /pings/{id} { allow create: if signedIn() && request.resource.data.from == request.auth.uid; allow read, delete: if isAdmin(); allow update: if false; }
    match /leaderboard/{id} { allow read: if signedIn(); allow write: if isAdmin(); }
    match /payoutsFeed/{id} { allow read: if signedIn(); allow write: if isAdmin(); }
    match /tgLinks/{id}    { allow read: if isAdmin() || (signedIn() && request.auth.uid == id); allow write: if isAdmin(); }
    match /botUsers/{id}   { allow read, write: if isAdmin(); }
    match /broadcasts/{id} { allow read, write: if isAdmin(); }
    match /joinReq/{id} {
      allow create, update: if signedIn() && request.auth.uid == id
                            && request.resource.data.keys().hasOnly(['initData','nonce','ts'])
                            && request.resource.data.initData is string && request.resource.data.initData.size() < 4100
                            && request.resource.data.nonce is string && request.resource.data.nonce.size() < 60;
      allow read, delete: if isAdmin();
    }
    match /joinRes/{id} {
      allow read: if signedIn() && (request.auth.uid == id || isAdmin());
      allow write: if false;
    }
    match /tgReq/{id} {
      allow create, update: if signedIn() && request.auth.uid == id && request.resource.data.keys().hasOnly(['initData','ts']);
      allow read, delete: if isAdmin();
    }

    match /refBonuses/{id} {
      allow read: if signedIn() && (resource.data.uid == request.auth.uid || isAdmin());
      allow create: if isAdmin();
      allow update, delete: if false;
    }
    match /adjustments/{id} {
      allow read: if signedIn() && (resource.data.uid == request.auth.uid || isAdmin());
      allow write: if isAdmin();
    }
    match /callLogs/{id} {
      allow create: if signedIn() && request.resource.data.from == request.auth.uid;
      allow read: if isAdmin();
    }

    match /taskDone/{id}  { allow read: if signedIn() && (resource.data.uid == request.auth.uid || isAdmin());
                            allow create: if mine() && id == request.auth.uid + "_" + request.resource.data.taskId
                              && get(/databases/$(database)/documents/tasks/$(request.resource.data.taskId)).data.reward == request.resource.data.reward; }
    match /adViews/{id}   { allow read: if signedIn() && (resource.data.uid == request.auth.uid || isAdmin());
                            allow create: if mine() && id == request.auth.uid + "_" + request.resource.data.adId + "_" + request.resource.data.slot
                              && request.resource.data.slot.matches('^[0-9]{10}(-[0-9])?$')
                              && get(/databases/$(database)/documents/ads/$(request.resource.data.adId)).data.reward == request.resource.data.reward; }
    match /bonuses/{id}   { allow read: if signedIn() && (resource.data.uid == request.auth.uid || isAdmin());
                            allow create: if mine() && id == request.auth.uid + "_" + request.resource.data.day
                              && get(/databases/$(database)/documents/settings/app).data.dailyBonus == request.resource.data.reward; }
    match /promoUse/{id}  { allow read: if signedIn() && (resource.data.uid == request.auth.uid || isAdmin());
                            allow create: if mine() && id == request.auth.uid + "_" + request.resource.data.code
                              && get(/databases/$(database)/documents/promos/$(request.resource.data.code)).data.reward == request.resource.data.reward; }

    match /withdrawals/{id} {
      allow read: if signedIn() && (resource.data.uid == request.auth.uid || isAdmin());
      allow create: if mine()
                    && request.resource.data.keys().hasOnly(['uid','name','amount','method','address','status','ts'])
                    && request.resource.data.status == "pending"
                    && request.resource.data.amount is number
                    && request.resource.data.amount >= appSettings().get('minWithdraw', 0.5)
                    && appSettings().get('withdrawOn', true) != false;
      allow update, delete: if isAdmin();
    }

    function fbSaleOk(id) {
      return request.resource.data.keys().hasOnly(['uid','name','fbUid','key','rate','status','ts'])
          && request.resource.data.status == "pending"
          && request.resource.data.fbUid == id
          && request.resource.data.rate is number
          && request.resource.data.rate > 0
          && request.resource.data.rate == appSettings().get('fbSellRate', 0)
          && appSettings().get('fbSellOn', true) != false;
    }
    match /fbSales/{id} {
      allow read: if signedIn() && (resource.data.uid == request.auth.uid || isAdmin());
      allow create: if mine() && fbSaleOk(id);
      allow update: if isAdmin() || (mine() && resource.data.uid == request.auth.uid && resource.data.status == "rejected" && fbSaleOk(id));
      allow delete: if isAdmin();
    }

    function igSaleOk(id) {
      return request.resource.data.keys().hasOnly(['uid','name','igUser','key','rate','status','ts'])
          && request.resource.data.status == "pending"
          && request.resource.data.igUser == id
          && request.resource.data.rate is number
          && request.resource.data.rate > 0
          && request.resource.data.rate == appSettings().get('igSellRate', 0)
          && appSettings().get('igSellOn', true) != false;
    }
    match /igSales/{id} {
      allow read: if signedIn() && (resource.data.uid == request.auth.uid || isAdmin());
      allow create: if mine() && igSaleOk(id);
      allow update: if isAdmin() || (mine() && resource.data.uid == request.auth.uid && resource.data.status == "rejected" && igSaleOk(id));
      allow delete: if isAdmin();
    }

    function gmSaleOk(id) {
      return request.resource.data.keys().hasOnly(['uid','name','gmail','pw','rate','status','ts'])
          && request.resource.data.status == "pending"
          && request.resource.data.gmail == id
          && request.resource.data.rate is number
          && request.resource.data.rate > 0
          && request.resource.data.rate == appSettings().get('gmSellRate', 0)
          && appSettings().get('gmSellOn', true) != false;
    }
    match /gmSales/{id} {
      allow read: if signedIn() && (resource.data.uid == request.auth.uid || isAdmin());
      allow create: if mine() && gmSaleOk(id);
      allow update: if isAdmin() || (mine() && resource.data.uid == request.auth.uid && resource.data.status == "rejected" && gmSaleOk(id));
      allow delete: if isAdmin();
    }

    match /gameWins/{id} {
      allow read: if signedIn() && (resource.data.uid == request.auth.uid || isAdmin());
      allow create: if mine()
                    && request.resource.data.keys().hasOnly(['uid','day','slot','level','reward','ts'])
                    && request.resource.data.day.matches('^[0-9]{8}$')
                    && request.resource.data.slot.matches(request.resource.data.day + '-([0-9]|[1-4][0-9])')
                    && id == request.auth.uid + "_" + request.resource.data.slot
                    && request.resource.data.reward is number
                    && request.resource.data.reward > 0
                    && request.resource.data.reward == appSettings().get('gameReward', 0)
                    && appSettings().get('gameOn', true) != false;
    }

    match /supportQ/{id} {
      allow read: if signedIn() && (resource.data.uid == request.auth.uid || isAdmin());
      allow create: if mine();
      allow update, delete: if isAdmin();
    }

    match /friendReqs/{id} {
      allow read: if signedIn() && (resource.data.from == request.auth.uid || resource.data.to == request.auth.uid);
      allow create: if signedIn() && request.resource.data.from == request.auth.uid;
      allow update: if signedIn() && resource.data.to == request.auth.uid;
      allow delete: if signedIn() && (resource.data.from == request.auth.uid || resource.data.to == request.auth.uid);
    }
    match /friends/{id} {
      allow read: if signedIn() && request.auth.uid in resource.data.members;
      allow create: if signedIn() && request.auth.uid in request.resource.data.members;
    }
    match /chats/{chat} {
      allow read: if isAdmin();
      allow read, write: if signedIn() && (request.auth.uid in resource.data.members || (request.resource != null && request.auth.uid in request.resource.data.members));
      match /msgs/{m} {
        allow read: if isAdmin() || (signedIn() && request.auth.uid in get(/databases/$(database)/documents/chats/$(chat)).data.members);
        allow create: if signedIn() && request.resource.data.from == request.auth.uid;
      }
      match /blobs/{b} {
        allow read: if isAdmin() || (signedIn() && request.auth.uid in get(/databases/$(database)/documents/chats/$(chat)).data.members);
        allow create: if signedIn() && request.resource.data.from == request.auth.uid;
      }
    }
    match /signals/{id} {
      allow create: if signedIn() && request.resource.data.from == request.auth.uid;
      allow read, delete: if signedIn() && resource.data.to == request.auth.uid;
    }
  }
}
</script>
